<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>playload demo</title>
  <style>
    body{margin:0;background:#dfe3ea;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#14161a}
    main{max-width:560px;margin:0 auto;padding:32px 16px 64px}
    h1{margin:0;font-size:34px}
    p.sub{margin:4px 0 20px;color:#6b7280}
    .demo-actions{margin-top:16px;display:flex;gap:8px;flex-wrap:wrap}
    .themes{margin:0 0 12px}
    .knobs{align-items:center;font-size:14px}
    .knobs label{display:flex;gap:6px;align-items:center}
    .demo-actions button.on{background:#14161a;color:#fff;border-color:#14161a}
    .demo-actions button{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:1px solid #c0c6d2;background:#fff;cursor:pointer}
  </style>
</head>
<body>
<main>
  <h1>Upload files</h1>
  <p class="sub">Drag and drop, or take the shot.</p>
  <div class="demo-actions themes" id="themes"></div>
  <play-load id="pl" accept=".pdf,image/*,.zip" max-size="26214400" max-files="200" choose-folder></play-load>
  <div class="demo-actions knobs">
    <label>Brand <input type="color" id="brand" value="#e8631f"></label>
    <label><input type="checkbox" id="dark"> Dark</label>
    <label><input type="checkbox" id="noconf"> No confetti</label>
  </div>
  <div class="demo-actions">
    <button id="pdf">Load a sample PDF ball</button>
    <button id="img">Load a sample PNG ball</button>
  </div>
</main>
<script type="module" src="/demo/main.ts"></script>
</body>
</html>
